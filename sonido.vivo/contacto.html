<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" type="image/png" href="img/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <header class="navbar">
    <a href="index.html" class="logo">
        <img src="img/logo.png" alt="Logo de Sonido Vivo" class="logo-img">
    </a>
    <button class="menu-toggle" onclick="document.querySelector('nav').classList.toggle('activo')" >☰</button>
    <nav>
      <ul>
        <li></li>
        <li><a href="index.html">Home</a></li>
        <li><a href="productos.html">Productos</a></li>
        <li><a href="sobre-nosotros.html">Nosotros</a></li>
        <li><a href="blogs.html">Blogs</a></li>
        <li><a href="contacto.html">Contacto</a></li>
        <hr style="border: 0; border-top: 1px solid rgba(255, 255, 255, 0.2); margin: 12px 0;">
      </ul>
    </nav>
    <div class="acciones ">
      <a href="login.html">Iniciar sesión</a> | <a href="registro.html">Registrarse</a>
      <a href="carrito.html">🛒 Cart (<span id="cart-count">0</span>)</a>
    </div>
  </header>

        <main class="container-contact">
        <section class="contact-section">
            <!-- Logo e Identidad de la empresa -->
            <div class="contact-header">
            <img src="img/logo.png" alt="Logo Sonido Vivo" class="contact-logo">
            </div>

            <!-- Tarjeta del Formulario -->
            <div class="contact-card">
            <div class="form-header">
                <h2>FORMULARIO DE CONTACTO</h2>
            </div>
            <form id="contactForm" class="contact-form" novalidate>
            <div class="form-group">
                <label for="nombre">NOMBRE COMPLETO *</label>
                <input type="text" id="nombre" name="nombre" maxlength="100">
                <span class="error-msg" id="error-nombre"></span>
            </div>

            <div class="form-group">
                <label for="correo">CORREO *</label>
                <input type="text" id="correo" name="correo" maxlength="100">
                <span class="error-msg" id="error-correo"></span>
            </div>

            <div class="form-group">
                <label for="mensaje">COMENTARIO *</label>
                <textarea id="mensaje" name="mensaje" rows="4" maxlength="500"></textarea>
                <small class="char-counter"><span id="contador">0</span> / 500 caracteres</small>
                <span class="error-msg" id="error-mensaje"></span>
            </div>

            <button type="submit" class="btn-submit">ENVIAR MENSAJE</button>
            </form>
            </div>
        </section>
        </main>
        <footer>
            <p>Sonido Vivo — Tienda de Instrumentos Musicales, Viña del Mar © 2026</p>
        </footer>
    <body class="fondo-tienda"> </body>
  <script src="js/validaciones.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
