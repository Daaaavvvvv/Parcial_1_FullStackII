<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nuevo Producto - Panel Admin - Sonido Vivo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>

  <div class="admin-layout">
    <aside class="admin-sidebar">
      <div class="admin-logo">Sonido Vivo</div>
      <nav>
        <ul>
          <li><a href="home-admin.html">Dashboard</a></li>
          <li><a href="productos-listado.html" class="activo">Productos</a></li>
          <li><a href="usuario-listado.html">Usuarios</a></li>
        </ul>
      </nav>
      <div class="admin-sidebar-footer">
        <a href="../login.html">Cerrar sesión</a>
      </div>
    </aside>

    <main class="admin-contenido">
      <h1>Nuevo Producto</h1>

      <form id="form-producto" class="admin-form" novalidate>
        <label for="codigo">Código producto</label>
        <input type="text" id="codigo" name="codigo">
        <span class="error" id="error-codigo"></span>

        <label for="nombre">Nombre</label>
        <input type="text" id="nombre" name="nombre">
        <span class="error" id="error-nombre"></span>

        <label for="descripcion">Descripción (opcional)</label>
        <textarea id="descripcion" name="descripcion" rows="3"></textarea>
        <span class="error" id="error-descripcion"></span>

        <label for="precio">Precio</label>
        <input type="number" id="precio" name="precio" min="0" step="0.01">
        <span class="error" id="error-precio"></span>

        <label for="stock">Stock</label>
        <input type="number" id="stock" name="stock" min="0" step="1">
        <span class="error" id="error-stock"></span>

        <label for="stock-critico">Stock Crítico (opcional)</label>
        <input type="number" id="stock-critico" name="stock-critico" min="0" step="1">
        <span class="error" id="error-stock-critico"></span>

        <label for="categoria">Categoría</label>
        <select id="categoria" name="categoria">
          <option value="">-- Seleccione categoría --</option>
          <option value="Guitarras Acústicas">Guitarras Acústicas</option>
          <option value="Guitarras Eléctricas">Guitarras Eléctricas</option>
          <option value="Bajos Eléctricos">Bajos Eléctricos</option>
          <option value="Baterías">Baterías</option>
          <option value="Teclados y Pianos">Teclados y Pianos</option>
          <option value="Amplificadores">Amplificadores</option>
          <option value="Micrófonos">Micrófonos</option>
          <option value="Pedales de Efectos">Pedales de Efectos</option>
          <option value="Accesorios">Accesorios</option>
          <option value="Estudio y Grabación">Estudio y Grabación</option>
        </select>
        <span class="error" id="error-categoria"></span>

        <label for="imagen">Imagen (opcional)</label>
        <input type="file" id="imagen" name="imagen" accept="image/*">

        <button type="submit">Guardar Producto</button>
      </form>
    </main>
  </div>

  <div id="modal-overlay" class="modal-overlay">
    <div class="modal-box">
      <p id="modal-mensaje"></p>
      <button onclick="cerrarModal()">Aceptar</button>
    </div>
  </div>

  <script src="../js/validaciones.js"></script>
  <script src="../js/productos.js"></script>
  <script src="../js/admin.js"></script>
</body>
</html>
