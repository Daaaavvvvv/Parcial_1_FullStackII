<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nuevo Usuario - Panel Admin - Sonido Vivo</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>

  <div class="admin-layout">
    <aside class="admin-sidebar">
      <div class="admin-logo">Sonido Vivo</div>
      <nav>
        <ul>
          <li><a href="home-admin.html">Dashboard</a></li>
          <li><a href="productos-listado.html">Productos</a></li>
          <li><a href="usuario-listado.html" class="activo">Usuarios</a></li>
        </ul>
      </nav>
      <div class="admin-sidebar-footer">
        <a href="../login.html">Cerrar sesión</a>
      </div>
    </aside>

    <main class="admin-contenido">
      <h1>Nuevo Usuario</h1>

      <form id="form-usuario" class="admin-form" novalidate>
        <label for="run">RUN</label>
        <input type="text" id="run" name="run" placeholder="19011022K">
        <span class="error" id="error-run"></span>

        <label for="nombre">Nombre</label>
        <input type="text" id="nombre" name="nombre">
        <span class="error" id="error-nombre"></span>

        <label for="apellidos">Apellidos</label>
        <input type="text" id="apellidos" name="apellidos">
        <span class="error" id="error-apellidos"></span>

        <label for="correo">Correo</label>
        <input type="email" id="correo" name="correo">
        <span class="error" id="error-correo"></span>

        <label for="fecha-nacimiento">Fecha de nacimiento (opcional)</label>
        <input type="date" id="fecha-nacimiento" name="fecha-nacimiento">

        <label for="tipo-usuario">Tipo de Usuario</label>
        <select id="tipo-usuario" name="tipo-usuario">
          <option value="">-- Seleccione tipo --</option>
          <option value="Administrador">Administrador</option>
          <option value="Vendedor">Vendedor</option>
          <option value="Cliente">Cliente</option>
        </select>
        <span class="error" id="error-tipo-usuario"></span>

        <label for="region">Región</label>
        <select id="region" name="region">
          <option value="">-- Seleccione la región --</option>
        </select>

        <label for="comuna">Comuna</label>
        <select id="comuna" name="comuna">
          <option value="">-- Seleccione la comuna --</option>
        </select>

        <label for="direccion">Dirección</label>
        <input type="text" id="direccion" name="direccion">
        <span class="error" id="error-direccion"></span>

        <button type="submit">Guardar Usuario</button>
      </form>
    </main>
  </div>

  <div id="modal-overlay" class="modal-overlay">
    <div class="modal-box">
      <p id="modal-mensaje"></p>
      <button onclick="cerrarModal()">Aceptar</button>
    </div>
  </div>

  <script src="../js/main.js"></script>
  <script src="../js/validaciones.js"></script>
  <script src="../js/admin.js"></script>
</body>
</html>
