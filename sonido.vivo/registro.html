<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro de usuario - Sonido Vivo</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <header class="navbar">
    <a href="index.html" class="logo">Sonido Vivo</a>
    <button class="menu-toggle" onclick="document.querySelector('nav').classList.toggle('activo')">☰</button>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="productos.html">Productos</a></li>
        <li><a href="sobre-nosotros.html">Nosotros</a></li>
        <li><a href="blogs.html">Blogs</a></li>
        <li><a href="contacto.html">Contacto</a></li>
      </ul>
    </nav>
    <div class="acciones">
      <a href="login.html">Iniciar sesión</a> | <a href="registro.html">Registrarse</a>
      <a href="carrito.html">🛒 Cart (<span id="cart-count">0</span>)</a>
    </div>
  </header>

  <main class="contenedor-form">
    <form id="form-registro" novalidate>
      <h2>Registro de usuario</h2>

      <label for="run">RUN</label>
      <input type="text" id="run" name="run" placeholder="19011022K">
      <span class="error" id="error-run"></span>

      <label for="nombre">Nombres</label>
      <input type="text" id="nombre" name="nombre">
      <span class="error" id="error-nombre"></span>

      <label for="apellidos">Apellidos</label>
      <input type="text" id="apellidos" name="apellidos">
      <span class="error" id="error-apellidos"></span>

      <label for="correo">Correo</label>
      <input type="email" id="correo" name="correo">
      <span class="error" id="error-correo"></span>

      <label for="password">Contraseña</label>
      <input type="password" id="password" name="password">
      <span class="error" id="error-password"></span>

      <label for="confirmar">Confirmar contraseña</label>
      <input type="password" id="confirmar" name="confirmar">
      <span class="error" id="error-confirmar"></span>

      <label for="telefono">Teléfono (opcional)</label>
      <input type="tel" id="telefono" name="telefono">

      <label for="region">Región</label>
      <select id="region" name="region">
        <option value="">-- Seleccione la región --</option>
      </select>

      <label for="comuna">Comuna</label>
      <select id="comuna" name="comuna">
        <option value="">-- Seleccione la comuna --</option>
      </select>

      <label for="direccion">Dirección</label>
      <input type="text" id="direccion" name="direccion">
      <span class="error" id="error-direccion"></span>

      <button type="submit">Registrar</button>
    </form>
  </main>

  <footer>
    <p>Sonido Vivo — Tienda de Instrumentos Musicales, Viña del Mar © 2026</p>
  </footer>

  <div id="modal-overlay" class="modal-overlay">
    <div class="modal-box">
      <p id="modal-mensaje"></p>
      <button onclick="cerrarModal()">Aceptar</button>
    </div>
  </div>

  <script src="js/validaciones.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
