spring.application.name=SonidoVivo-backend

# Servidor
server.port=8080

# Base de datos MySQL (se pueden sobreescribir con variables de entorno)
spring.datasource.url=${DB_URL:jdbc:mysql://host.docker.internal:3306/dsy1104_TeamMusic?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:123456}

# Flyway maneja el esquema; Hibernate solo lo valida
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
